name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK, so it is configured directly instead of through a
      # third-party setup action: fewer moving parts, and F-Droid maintainers can read exactly what
      # the build needs. The toolchain is pinned here and in gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace --console=plain

      # Logs of a failed run are not always reachable from outside; annotations are. Put the lines
      # that explain the failure into error annotations and the summary, so a red run is diagnosable
      # from the API alone.
      - name: Report build failure
        if: failure()
        run: |
          grep -nE "^(e: |FAILURE|\* What went wrong|Execution failed|Caused by)" -A 8 build.log 2>/dev/null | head -80 || true
          {
            echo "### Build log tail"
            echo '```'
            tail -60 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|Execution failed|Caused by" build.log 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::error title=gradle::$line"
          done

      - name: Name the artifact
        run: |
          mkdir -p out
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then version="dev-${GITHUB_SHA::7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "out/handwrite-$version.apk"
          sha256sum "out/handwrite-$version.apk" > "out/handwrite-$version.apk.sha256"
          cat "out/handwrite-$version.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      # A tag build also commits its APK to dist/, so that the download link in the README matches the
      # newest release without anybody having to touch the repository by hand.
      - name: Publish APK to dist/
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only a tag build publishes to dist/. A per-commit build would either need a name nobody
          # downloads, or would overwrite the APK the README links to on every commit - so ordinary
          # pushes just leave the APK attached to the run.
          VERSION="$(basename out/*.apk | sed 's/^handwrite-//; s/\.apk$//')"
          cp "out/handwrite-$VERSION.apk" dist/
          # the checksum file is rewritten so it points at dist/, not at out/: people who download
          # both files from the repository must be able to verify them with plain "sha256sum -c"
          ( cd dist && sha256sum "handwrite-$VERSION.apk" > "handwrite-$VERSION.apk.sha256" )
          git add dist/*.apk dist/*.sha256
          if git diff --cached --quiet; then echo "dist/ already up to date"; exit 0; fi
          git commit -m "dist: APK $VERSION from ${GITHUB_SHA::7}"
          # a tag build runs on a detached HEAD, so the commit is pushed to the default branch
          # explicitly; retries cover the case where main moved while the build was running
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main || git rebase --abort
            sleep 5
          done
          exit 1

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: true

  # F-Droid's hard requirements are cheap to check and expensive to notice late, so they run on every
  # build. This is a separate job on purpose: its run summary and annotations are served through the
  # ordinary API, so the result can be read without the (often unreachable) job logs.
  fdroid-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"; fi
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Resolve dependencies
        run: gradle --no-daemon -q :app:dependencies --configuration releaseRuntimeClasspath | tee deps.txt

      - name: Pin every runtime dependency
        run: |
          set -e
          if grep -qE "kotlin-stdlib-jdk7|kotlin-stdlib-jdk8" deps.txt; then
            echo "::error title=pinning::legacy kotlin-stdlib-jdk7/jdk8 is on the classpath (its classes live in kotlin-stdlib since 1.8)"
            exit 1
          fi
          stdlib=$(grep -oE "kotlin-stdlib:[^ ]+" deps.txt | sort -u | wc -l)
          echo "distinct kotlin-stdlib entries: $stdlib"
          if [ "$stdlib" -ne 1 ]; then
            echo "::error title=pinning::expected exactly one kotlin-stdlib version, found $stdlib"
            exit 1
          fi
          if grep -E "^[|\\+ ]*(\\+---|\\---) " deps.txt | grep -vE ":[0-9]+(\\.[0-9]+)*([.-][A-Za-z0-9]+)*$"; then
            echo "::error title=pinning::a runtime dependency has no exact version (see the lines above)"
            exit 1
          fi
          if grep -qiE "okhttp|retrofit|firebase|crashlytics|play-services|analytics" deps.txt; then
            echo "::error title=trackers::a network/analytics library slipped into the dependencies"
            exit 1
          fi

      - name: Build the APK to inspect
        run: gradle --no-daemon assembleRelease

      - name: No permissions, no INTERNET
        run: |
          set -e
          AAPT="$(ls -d "$ANDROID_HOME"/build-tools/*/ | tail -1)aapt2"
          "$AAPT" dump permissions app/build/outputs/apk/release/app-release-unsigned.apk | tee perms.txt
          if grep -q "uses-permission" perms.txt; then
            echo "::error title=permissions::the app declares permissions, but its store description says it needs none"
            exit 1
          fi

      # Everything the check learned, in a place that is readable even when the job logs are not.
      - name: Summary
        if: always()
        run: |
          {
            echo "## F-Droid audit"
            echo
            echo "### Runtime dependencies"
            echo '```'
            grep -E "^[|\\+ ]*(\\+---|\\---) " deps.txt 2>/dev/null || echo "(none beyond the Kotlin stdlib)"
            echo '```'
            echo "### Permissions in the release APK"
            echo '```'
            cat perms.txt 2>/dev/null || echo "(the APK was not built, see the job log)"
            echo '```'
            echo "### Result"
            echo "${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
