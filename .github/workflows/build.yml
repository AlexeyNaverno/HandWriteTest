name: Build APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The runner image ships an Android SDK, so it is configured directly instead of through a
      # third-party setup action: fewer moving parts, and F-Droid maintainers can read exactly what
      # the build needs. The toolchain is pinned here and in gradle/wrapper/gradle-wrapper.properties.
      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "sdk.dir=$SDK" > local.properties
          SM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SM" ]; then SM="$(ls -d "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"; fi
          echo "sdkmanager: $SM"
          yes | "$SM" --licenses > /dev/null || true
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
          ls "$SDK/platforms" "$SDK/build-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest --stacktrace --console=plain

      # Logs of a failed run are not always reachable from outside; annotations are. Put the lines
      # that explain the failure into error annotations and the summary, so a red run is diagnosable
      # from the API alone.
      - name: Report build failure
        if: failure()
        run: |
          grep -nE "^(e: |FAILURE|\* What went wrong|Execution failed|Caused by)" -A 8 build.log 2>/dev/null | head -80 || true
          {
            echo "### Build log tail"
            echo '```'
            tail -60 build.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |What went wrong|Execution failed|Caused by" build.log 2>/dev/null | head -20 | while IFS= read -r line; do
            echo "::error title=gradle::$line"
          done

      - name: Name the artifact
        run: |
          mkdir -p out
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ] || [ "$version" = "$GITHUB_REF_NAME" ]; then version="dev-${GITHUB_SHA::7}"; fi
          cp app/build/outputs/apk/release/app-release.apk "out/handwrite-$version.apk"
          sha256sum "out/handwrite-$version.apk" > "out/handwrite-$version.apk.sha256"
          cat "out/handwrite-$version.apk.sha256"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      # The APK is also committed to dist/ so that the download link in the README always matches the
      # newest build without anybody having to touch the repository by hand.
      - name: Publish APK to dist/
        if: github.event_name != 'pull_request' && !startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          VERSION="$(basename out/*.apk | sed 's/^handwrite-//; s/\.apk$//')"
          cp "out/handwrite-$VERSION.apk" dist/
          cp "out/handwrite-$VERSION.apk.sha256" dist/
          git add dist/
          if git diff --cached --quiet; then echo "dist/ already up to date"; exit 0; fi
          git commit -m "dist: APK $VERSION from ${GITHUB_SHA::7}"
          for i in 1 2 3; do
            git push && exit 0
            git pull --rebase
            sleep 5
          done
          exit 1

      - name: Attach APK to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          prerelease: true
